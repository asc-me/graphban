# Known-SDK table shipped with gban (GRPH-P55 §3). Versioned with the package.
# A project adds rows in `.graphban/stack-sdks.toml` using the same shape.
# New shipped rows arrive by PR. cli/tests/test_stackmap.py exercises every row.
# `domains` on an external row: a URL host equal to or under one of them is that
# service, so `api.stripe.com` and the `stripe` package draw one node, not two.

[[image]]
id = "postgres"
names = ["postgres", "pgvector/pgvector"]
kind = "postgres"
label = "Postgres"
protocol = "postgres"

[[image]]
id = "redis"
names = ["redis", "bitnami/redis"]
kind = "redis"
label = "Redis"
protocol = "redis"

[[image]]
id = "rabbitmq"
names = ["rabbitmq", "bitnami/rabbitmq"]
kind = "rabbitmq"
label = "RabbitMQ"
protocol = "amqp"

[[image]]
id = "mysql"
names = ["mysql", "mariadb"]
kind = "mysql"
label = "MySQL"
protocol = "mysql"

[[image]]
id = "mongo"
names = ["mongo", "mongodb"]
kind = "mongodb"
label = "MongoDB"
protocol = "mongodb"

