# FROZEN, not branding. `docker compose` derives the project name from the directory, and
# volumes are named <project>_<volume-key> — live, that is `agentledger_agentledger_pgdata`.
# Pinning it here stops the project name tracking the directory, so this repo can be
# renamed without orphaning the Postgres volume and appearing to lose the database.
# Same rule as PRD-13: an identifier existing data is keyed by is identity, not a label.
name: agentledger

services:
  db:
    # Comes back after a host reboot. Without it a reboot leaves the whole stack down
    # while the box's other containers return (seen on ubuntu-srv 2026-11-09).
    # unless-stopped, not always: `docker compose stop` still means stopped.
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      # These defaults are baked into the volume at initdb, so they are frozen too — a
      # self-host that never wrote a .env would fail auth on its next `up` if they moved.
      POSTGRES_USER: ${POSTGRES_USER:-agentledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentledger}
      POSTGRES_DB: ${POSTGRES_DB:-agentledger}
    volumes:
      - agentledger_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentledger}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentledger}:${POSTGRES_PASSWORD:-agentledger}@db:5432/${POSTGRES_DB:-agentledger}
      GIT_SHA: ${GIT_SHA:-unknown}
      # uvicorn workers; 0 = min(4, cpu_count), 1 = single process (GRPH-1241).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-0}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production-0123456789abcdef}
      # One proxy in front (Caddy), so the rate limiter reads one hop from the RIGHT of
      # X-Forwarded-For — what Caddy actually observed, rather than the client-supplied
      # prefix it appends to (GRPH-553). This is the value that makes per-IP limits
      # per-IP on the self-host; leaving it 0 means every caller shares one bucket.
      TRUSTED_HOPS: ${TRUSTED_HOPS:-1}
      # Where the box CA writes box.crt/box.key. The web container reloads Caddy itself when
      # they change, so TLS_RELOAD_URL stays empty (GRPH-1635).
      TLS_DIR: /etc/graphban/tls
      # The published HTTPS port (the web service maps it below). The API builds the box's
      # `https_url` from it for /api/https; not forwarding it would report :8443 whatever
      # the operator set — the GRPH-553/GRPH-1579 class (GRPH-1664).
      WEB_HTTPS_PORT: ${WEB_HTTPS_PORT:-8443}
      # Deprecated, and it was never forwarded here at all before GRPH-553 — so the
      # flag docs/deploy.md told an operator to consider had no effect on this
      # stack whatever they set it to. Passed through now so the documented knob
      # and the running process agree.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      # Browser push (P75 D4). Not forwarded before GRPH-1579, so keys set in .env never
      # reached the API. Empty keys keep the "not set up on this deployment" state.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      # Printed in the startup log: "open this to continue setup" (GRPH-P67 G3).
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:${WEB_PORT:-8080}}
      SEED_ON_START: ${SEED_ON_START:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      EMBED_DIM: ${EMBED_DIM:-384}
      # AI providers (F1). Defaults are all-stub → fully offline.
      EMBED_PROVIDER: ${EMBED_PROVIDER:-stub}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-stub}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      SYNC_DIR: /data/sync
      # Local -> console code-graph push and link (GRPH-1554). Empty leaves the box unlinked.
      SYNC_CLOUD_URL: ${SYNC_CLOUD_URL:-}
      SYNC_API_KEY: ${SYNC_API_KEY:-}
      # Project-sync flush budget (GRPH-1735). Defaults are D11; set these to change them.
      SYNC_FLUSH_SECONDS: ${SYNC_FLUSH_SECONDS:-5}
      SYNC_FLUSH_BYTES_PER_MIN: ${SYNC_FLUSH_BYTES_PER_MIN:-262144}
      SYNC_FLUSH_REQUESTS_PER_MIN: ${SYNC_FLUSH_REQUESTS_PER_MIN:-30}
      # Optional token for the update check's GitHub API calls (GRPH-1663). Empty is
      # unauthenticated (60/hour shared per public IP). The CI pull loop uses the same
      # token and does not call GitHub when it is empty (GRPH-1822).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-${GRAPHBAN_GITHUB_TOKEN:-}}
      # How often the leader pulls GitHub check-runs. 0 disables. A head is still
      # polled at most every 60s (GRPH-1822).
      CI_PULL_SECONDS: ${CI_PULL_SECONDS:-60}
    volumes:
      # Drive sync target. Point SYNC_HOST_DIR at a Google Drive Desktop folder to reach Drive.
      - ${SYNC_HOST_DIR:-./sync}:/data/sync
      # Compose apply helper. Mount the DIRECTORY that contains apply.sock, not
      # the socket file (inode changes on helper restart would stale a file mount).
      # Default is an empty local dir — no socket, Install stays disabled. Not
      # the Docker socket. See docs/deploy.md.
      - ${GRAPHBAN_APPLY_DIR:-./.graphban-apply}:/run/graphban-apply
      # The box certificate the CA writes for the web container to serve (GRPH-1635).
      - box_tls:/etc/graphban/tls
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    restart: unless-stopped
    build:
      context: ./web
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
      # The box's HTTPS listener (GRPH-1635). Serves the certificate the API's box CA writes
      # into the shared `box_tls` volume; the Caddy admin API is NOT published.
      - "${WEB_HTTPS_PORT:-8443}:8443"
    volumes:
      - box_tls:/etc/graphban/tls:ro

volumes:
  # The box certificate the API writes (TLS_DIR) and the web container serves (GRPH-1635).
  box_tls:
  # Frozen: renaming this key orphans the existing volume and reads as data loss.
  agentledger_pgdata:
