# FROZEN, not branding. `docker compose` derives the project name from the directory, and
# volumes are named <project>_<volume-key> — live, that is `agentledger_agentledger_pgdata`.
# Pinning it here stops the project name tracking the directory, so this repo can be
# renamed without orphaning the Postgres volume and appearing to lose the database.
# Same rule as PRD-13: an identifier existing data is keyed by is identity, not a label.
name: agentledger

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      # These defaults are baked into the volume at initdb, so they are frozen too — a
      # self-host that never wrote a .env would fail auth on its next `up` if they moved.
      POSTGRES_USER: ${POSTGRES_USER:-agentledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentledger}
      POSTGRES_DB: ${POSTGRES_DB:-agentledger}
    volumes:
      - agentledger_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentledger}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agentledger}:${POSTGRES_PASSWORD:-agentledger}@db:5432/${POSTGRES_DB:-agentledger}
      GIT_SHA: ${GIT_SHA:-unknown}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-in-production-0123456789abcdef}
      # One proxy in front (nginx), so the rate limiter reads one hop from the RIGHT of
      # X-Forwarded-For — what nginx actually observed, rather than the client-supplied
      # prefix it appends to (GRPH-553). This is the value that makes per-IP limits
      # per-IP on the self-host; leaving it 0 means every caller shares one bucket.
      TRUSTED_HOPS: ${TRUSTED_HOPS:-1}
      # Deprecated, and it was never forwarded here at all before GRPH-553 — so the
      # flag docs/deploy.md told an operator to consider had no effect on this
      # stack whatever they set it to. Passed through now so the documented knob
      # and the running process agree.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-false}
      SEED_ON_START: ${SEED_ON_START:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      EMBED_DIM: ${EMBED_DIM:-384}
      # AI providers (F1). Defaults are all-stub → fully offline.
      EMBED_PROVIDER: ${EMBED_PROVIDER:-stub}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-stub}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3.1:8b}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBED_MODEL: ${OPENAI_EMBED_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
      SYNC_DIR: /data/sync
    volumes:
      # Drive sync target. Point SYNC_HOST_DIR at a Google Drive Desktop folder to reach Drive.
      - ${SYNC_HOST_DIR:-./sync}:/data/sync
      # Compose apply helper. Mount the DIRECTORY that contains apply.sock, not
      # the socket file (inode changes on helper restart would stale a file mount).
      # Default is an empty local dir — no socket, Install stays disabled. Not
      # the Docker socket. See docs/deploy.md.
      - ${GRAPHBAN_APPLY_DIR:-./.graphban-apply}:/run/graphban-apply
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: ./web
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  # Frozen: renaming this key orphans the existing volume and reads as data loss.
  agentledger_pgdata:
