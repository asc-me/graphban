# Tell an open PR when its BASE has moved under it, in files it also changes.
#
# `strict` branch protection does this by forcing every PR up to date before merging, and it
# was tried here for exactly one day: it blocks STACKED work, where PR 2 is deliberately
# built on PR 1 and is behind by construction. Failing correct work is a worse failure than
# the one being prevented.
#
# So this warns rather than gates, and only when staleness can actually hurt: the base's new
# commits must touch a file the PR also touches. A PR behind by fifty commits that touch
# nothing it touches is fine, and saying otherwise teaches people to click through the
# warning — which is how the real one becomes invisible.
#
# TWO KINDS OF HURT, and collapsing them was making the loud one quieter.
#
#   CONFLICT  — the merge will not apply. `git merge-tree` says so with certainty, and it is
#               the same answer GitHub's merge button will give.
#   UNTESTED  — the merge applies cleanly and CI has never run on the combination. Same file,
#               distant regions: nothing to resolve, and nothing has proved the result works.
#
# A conflict-only check would MISS the case that motivated all of this. #652 and #653 merged
# cleanly and broke semantically — the trunk went red on a role one removed and the other
# used, in different files. So "only look for conflicts" would have been silent on the exact
# failure, and file-overlap alone cried wolf on every same-file-different-region PR. Both
# states are reported, labelled, and worded differently.
#
# NEITHER ASKS FOR A REBASE. The remedy is always to MERGE the base in: rebasing a published
# branch rewrites history that anything stacked on it is built from, and this whole workflow
# exists because stacking has to keep working.
#
# Measured on the case that motivated it: #652 removed a role in `services/fleet.py` while
# #653 added a test using it, and the two shared `mcp_server.py` and `routers/fleet.py`. An
# overlap check catches that pair; a commit-count check fires on every PR in the repository.
#
# EACH PR IS COMPARED AGAINST ITS OWN BASE, not against main. A PR stacked on another PR's
# branch has main in neither operand, and measuring it against main would report a diff
# against work it never claimed to contain — noise on exactly the workflow this exists to
# keep working.
#
# That DEFERS a warning rather than strictly improving on comparing to main, and the trade is
# worth stating. If main moves in a file that PR 2 (stacked on PR 1) changes, comparing to
# main would flag it now; comparing to PR 1 says nothing, because PR 2 merges into PR 1 and
# that merge really is clean. The conflict is real but not yet actionable — PR 2 cannot reach
# main until PR 1 does.
#
# The deferral is bounded, and by the same event: merging PR 1 is a push to main, which runs
# this, and by then GitHub has retargeted PR 2 onto main. So the warning arrives at the first
# moment somebody can act on it, rather than sitting on a PR whose merge it does not describe.
#
# Two triggers, because one moment is not enough. A push to main catches every open PR that
# targets it, which is the moment staleness is CREATED. `pull_request` catches the PR that
# was opened or updated while already behind, which the push-only version never looked at
# again until the base happened to move.
#
# NOT a gate. `CI` stays the only required check. CI already tests the merge of the PR into
# its base — it simply does not re-run when the base moves, and that gap is the subject.
name: Base freshness

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  overlap:
    runs-on: ubuntu-latest
    # A fork's `pull_request` token is read-only, so the comment would fail after doing all
    # the work. Skipping says so once instead of failing every fork PR.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Warn PRs whose base moved under them, in files they also change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          THIS_PR: ${{ github.event.pull_request.number }}
          PUSHED_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A sticky marker, so this edits one comment per PR rather than adding one per run.
          MARK='<!-- base-freshness -->'

          if [ "$EVENT" = "pull_request" ]; then
            prs="$THIS_PR"
          else
            # Only PRs that target the branch that just moved. A PR based on another branch
            # is not affected by this push, and warning it would be a claim about a base it
            # does not have.
            prs=$(gh pr list --repo "$REPO" --state open --base "$PUSHED_BRANCH" \
                    --json number --jq '.[].number')
          fi

          for pr in $prs; do
            base_ref=$(gh pr view "$pr" --repo "$REPO" --json baseRefName --jq '.baseRefName')
            git fetch -q origin "$base_ref" "pull/$pr/head:pr-$pr" || continue
            base_tip=$(git rev-parse FETCH_HEAD)
            base=$(git merge-base "pr-$pr" "$base_tip")

            overlap=""
            conflict=0
            if [ "$base" != "$base_tip" ]; then
              git diff --name-only "$base" "pr-$pr" | sort -u > /tmp/pr.files
              git diff --name-only "$base" "$base_tip" | sort -u > /tmp/base.files
              overlap=$(comm -12 /tmp/pr.files /tmp/base.files || true)
              # A trial merge in memory: no worktree, no checkout, nothing written. Probed
              # for support first — on a git too old for `--write-tree` the command fails as
              # a USAGE error, and reading that as "conflict" would put a false alarm on
              # every PR in the repository.
              if git merge-tree --write-tree HEAD HEAD >/dev/null 2>&1; then
                git merge-tree --write-tree "$base_tip" "pr-$pr" >/dev/null 2>&1 || conflict=1
              fi
            fi

            existing=$(gh api "repos/$REPO/issues/$pr/comments" \
              --jq "[.[] | select(.body | startswith(\"$MARK\"))] | first | .id // empty")

            if [ "$conflict" = "1" ]; then
              n=$(printf '%s\n' "$overlap" | wc -l | tr -d ' ')
              body=$(printf '%s\n**This branch and `%s` no longer merge.** A trial merge conflicts, in %s file(s) both changed.\n\n```\n%s\n```\n\nMerge `%s` in and resolve it here, where CI can then run on the result. Do NOT rebase: this branch is published, and anything stacked on it is built from the history a rebase would rewrite.\n' "$MARK" "$base_ref" "$n" "$overlap" "$base_ref")
            elif [ -n "$overlap" ]; then
              n=$(printf '%s\n' "$overlap" | wc -l | tr -d ' ')
              body=$(printf '%s\n**`%s` moved under this branch, in %s file(s) it also changes.** They still merge cleanly — this is not a conflict.\n\nWhat is missing is a test of the combination: CI ran against `%s` as it stood when this branch last did, and does not re-run when the base moves. Two changes can each be green on their own base and break together, which is how the trunk went red here on 2026-09-06.\n\n```\n%s\n```\n\nMerge `%s` in and let CI run again, or satisfy yourself the two do not interact.\n' "$MARK" "$base_ref" "$n" "$base_ref" "$overlap" "$base_ref")
            else
              body=$(printf '%s\nNothing that has landed on `%s` since this branch left it touches a file this branch changes.\n' "$MARK" "$base_ref")
            fi

            if [ -n "$existing" ]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$existing" -f body="$body" >/dev/null
            elif [ -n "$overlap" ] || [ "$conflict" = "1" ]; then
              # Only OPEN a comment for a real overlap. A "nothing to see here" note on every
              # PR on every run is the noise that hides the one that matters. An existing
              # comment is still updated, so a resolved warning says so instead of standing.
              gh api -X POST "repos/$REPO/issues/$pr/comments" -f body="$body" >/dev/null
            fi
            if [ "$conflict" = "1" ]; then verdict="CONFLICTS in $n file(s)"
            elif [ -n "$overlap" ]; then verdict="untested overlap in $n file(s)"
            else verdict="clear"; fi
            echo "PR #$pr (base $base_ref): $verdict"
          done
