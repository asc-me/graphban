# Publish one package to PyPI, from a tag that names it.
#
# TWO PACKAGES IN ONE REPOSITORY, with separate lifecycles: `graphban-cli` installs on a
# laptop and pulls nothing, `graphban-fleet` runs waves and brings httpx. Tying them to one
# version number would mean a `gban` release every time an adapter changed, so the tag names
# the package and only that package is built and published.
#
#     git tag cli-v0.2.0   && git push origin cli-v0.2.0
#     git tag fleet-v0.3.1 && git push origin fleet-v0.3.1
#
# THE TAG AND THE PYPROJECT MUST AGREE, and this refuses when they do not. Tagging `v0.2.0`
# and shipping `0.1.0` is the classic release bug, and it is unrecoverable in the way that
# matters: a version number on PyPI can never be reused, so the fix is always a new number
# and a wrong one that got published stays published.
#
# Trusted publishing (OIDC), so there is no API token in this repository to leak or rotate.
# It requires a one-time setup per project on PyPI — a "pending publisher" naming this
# repository, this workflow filename, and the environment below — which cannot be automated
# from here because it is an act on somebody's PyPI account.
name: Release

on:
  push:
    tags:
      - "cli-v*"
      - "fleet-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub environment, so a publish can require a human click. PyPI's trusted publisher
    # is matched against this name too, which means a workflow that skipped it could not
    # publish even if somebody added one.
    environment: pypi
    permissions:
      # The OIDC token trusted publishing exchanges for an upload. Nothing else: this job
      # reads a tag and uploads a file, and `contents: read` is the whole of the rest.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Work out which package this tag releases, and check the version agrees
        id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            cli-v*)   dir=cli;   name=graphban-cli;   want="${TAG#cli-v}" ;;
            fleet-v*) dir=fleet; name=graphban-fleet; want="${TAG#fleet-v}" ;;
            *) echo "::error::tag $TAG names no package"; exit 1 ;;
          esac

          # Read the version the package will actually build as, from the file that decides
          # it — not from the tag, which is the thing being checked.
          have=$(python3 - "$dir/pyproject.toml" <<'PY'
          import sys, tomllib
          print(tomllib.load(open(sys.argv[1], "rb"))["project"]["version"])
          PY
          )
          if [ "$want" != "$have" ]; then
            echo "::error::tag $TAG says $want, $dir/pyproject.toml says $have. Nothing is"\
                 "published: a version on PyPI can never be reused, so a mismatch shipped"\
                 "once is shipped forever."
            exit 1
          fi
          echo "dir=$dir"   >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "publishing $name $have from $dir/"

      - name: Build
        env:
          DIR: ${{ steps.pkg.outputs.dir }}
        run: uv build --out-dir dist "$DIR"

      - name: Check the artifacts before anything leaves the machine
        run: uvx twine check dist/*

      - uses: pypa/gh-action-pypi-publish@release/v1
