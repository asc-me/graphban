name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # What actually changed. Every other job gates on this, so a web-only PR does not pay
  # for two backend suites and a backend-only PR does not pay for a frontend build.
  #
  # Deliberately coarse. A finer split (per-service, per-module) would need a dependency
  # map that nothing keeps honest, and a filter that silently under-runs is worse than one
  # that over-runs — a green tick has to mean the thing was tested.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      fleet: ${{ steps.filter.outputs.fleet }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # On push to main the base is the previous commit; on a PR it is the merge base.
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
              # The backend suite reads these, so a PR touching only them must still run
              # it — otherwise the guards that exist to keep them honest never fire, and
              # the filter silently turns a doc edit into an untested one.
              # `test_docs_sync` reads AGENTS.md and docs/mcp.md; `test_prd_sync` reads
              # every docs/prd-*.md; `test_subagent_fleet` reads AGENTS.md via the
              # generator.
              - 'AGENTS.md'
              - 'docs/**'
            frontend:
              - 'web/**'
              - '.github/workflows/ci.yml'
            # graphban-fleet is a separate distribution (PRD-22 D-e) with its own
            # pyproject and venv. Its suite reads backend/pyproject.toml to derive the
            # dependencies it must NOT share, so a backend dependency change has to run
            # it too — otherwise the thin-install guard goes stale without failing.
            fleet:
              - 'fleet/**'
              - 'backend/pyproject.toml'
              # `test_adapters` reads docs/fleet-adapters.md and asserts the support
              # matrix matches the registry. Without this the matrix could drift with a
              # green tick, which is the exact failure that guard exists to prevent.
              - 'docs/fleet-adapters.md'
              - 'docs/fleet-supervisor-walk.md'
              - '.github/workflows/ci.yml'

  backend-sqlite:
    name: Backend tests (SQLite)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - run: uv venv --python 3.12 .venv
      - run: uv pip install -e ".[dev]"
      # -n auto: one worker per core, each with its own database (see tests/conftest.py).
      # The suite is serial otherwise and the runner has cores going spare.
      - run: .venv/bin/python -m pytest -q -n auto

  backend-postgres:
    # Proves what SQLite cannot: the full Alembic chain from empty, and the real
    # pgvector `<=>` search path (see AL-57 — ivfflat recall bug this job caught).
    name: Backend tests (Postgres + pgvector)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: graphban_test
        ports:
          - 5432:5432
        # The cluster lives in RAM (GRPH-529). This database is created, migrated and
        # destroyed inside one job, and the Postgres job is the whole CI wall clock —
        # 8m38s of 9m, running the same tests as the SQLite job in 1.8x the time. The gap
        # is what each test pays to have a database, and most of that is durability the
        # runner's network-backed disk charges full price for on data with a nine-minute
        # lifetime. Nothing here needs to survive the job, so nothing here is written to
        # disk. `size` is generous over the seeded dataset; the runner has 16GB.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
          --tmpfs /var/lib/postgresql/data:rw,size=2048m
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/graphban_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - run: uv venv --python 3.12 .venv
      - run: uv pip install -e ".[dev]"
      # -n auto: one worker per core, each with its own database (see tests/conftest.py).
      # The suite is serial otherwise and the runner has cores going spare.
      - run: .venv/bin/python -m pytest -q -n auto

  frontend:
    name: Frontend tests + typecheck + build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Newer corepack pnpm's minimumReleaseAge policy rejects same-day packages;
      # same pin as web/Dockerfile.
      NPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from web/package.json packageManager
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  fleet:
    name: Fleet supervisor tests
    needs: changes
    if: needs.changes.outputs.fleet == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fleet
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: fleet/pyproject.toml
      - run: uv venv --python 3.12 .venv
      # Installed, not just on the path: the suite asserts against the console script
      # and the packaged version, and refuses to run against an uninstalled tree.
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q

  # A single required check, so branch protection has one name to point at whatever the
  # filters decided to run. Without it a skipped job reads as "pending" forever on a
  # protected branch — the filter would look like it had wedged CI rather than saved time.
  ci:
    name: CI
    # `changes` is in here deliberately. Without it, a failure in the filter job skips
    # every suite, the gate sees nothing but skips, and CI reports GREEN having run no
    # tests at all — the filter breaking would look exactly like a PR that needed no work.
    #
    # Every job defined above must appear here. A job that runs but is not needed by this
    # gate is worse than no job: it burns the minutes and reports nowhere.
    # `test_ci_gate_covers_every_job` in the backend suite is what enforces that.
    needs: [changes, backend-sqlite, backend-postgres, frontend, fleet]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if anything that ran did not pass
        # `skipped` is a pass here and `failure`/`cancelled` are not. Checking the results
        # explicitly rather than trusting `needs.*.result == 'success'`, because a skipped
        # job is not a success and would fail the gate for the exact PRs the filters exist
        # to speed up.
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job reported '$r'"; exit 1 ;;
            esac
          done

      # A STEP, not a job (GRPH-551). Steps stop at the first failure, so this is
      # unreachable unless the check above passed — there is no window in which a masked
      # failure gets attested. A separate job would also have to appear in `ci.needs` to
      # satisfy `test_ci_gate_covers_every_job`, and a job that runs after the gate cannot
      # be one of its dependencies.
      - name: Check out (the gate job has no source yet)
        if: always()
        uses: actions/checkout@v4
      # BEFORE the attestation and unconditionally, which is the whole point (GRPH-555).
      # A failing run writes no receipt — but it must still move the head, or the last
      # PASSING attestation goes on opening the gate for code that has since broken. That is
      # the case the staleness check exists for, and it is only reachable if this step runs
      # when the one above it failed.
      - name: Record the commit this run observed
        if: always()
        env:
          GRAPHBAN_URL: ${{ vars.GRAPHBAN_URL }}
          GRAPHBAN_GATE_KEY: ${{ secrets.GRAPHBAN_GATE_KEY }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/attest_ci.py --mode head \
            --commit "$HEAD_SHA" \
            --branch "$HEAD_REF" \
            --text "$PR_TITLE $PR_BODY"
      - name: Attest the items this green run vouches for
        # EVERY value crosses into this step through `env`, never through `${{ }}` inside
        # `run`. Actions substitutes an expression into the script TEXT before any shell
        # sees it, so a pull request title, body or branch name — all writable by whoever
        # opened it — becomes shell source. This step is where the gate key lives, so the
        # payload would run with the credential that certifies completion.
        #
        # It is not hypothetical: the first version interpolated the body directly, and the
        # PR that exposed it was an ordinary one whose markdown contained backticks and
        # quotes. CI reported a syntax error, which is the harmless end of the same defect.
        #
        # An `env` value is passed to the process, not pasted into the program, so a body
        # full of `$(...)` arrives at Python as characters.
        env:
          GRAPHBAN_URL: ${{ vars.GRAPHBAN_URL }}
          GRAPHBAN_GATE_KEY: ${{ secrets.GRAPHBAN_GATE_KEY }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/attest_ci.py \
            --commit "$HEAD_SHA" \
            --branch "$HEAD_REF" \
            --run-url "$RUN_URL" \
            --text "$PR_TITLE $PR_BODY"
