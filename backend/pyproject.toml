[project]
name = "graphban-api"
version = "2026.10.21"
description = "Graphban backend — linear tracker + agent memory + MCP tools"
license = "LicenseRef-FSL-1.1-Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "httpx>=0.28",
    "cryptography>=43",
    "redis>=5.2",
]

[project.scripts]
# Both names run the same CLI through the rename; `agentledger` is kept indefinitely so a
# documented command in an operator's runbook never stops working (AL-262).
graphban = "app.cli:main"
agentledger = "app.cli:main"

[project.optional-dependencies]
# Cloud chat/extraction via Claude. Local (Ollama) and stub need no extra deps.
cloud = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.3",
    # Parallel test execution. Each worker gets its OWN database — see tests/conftest.py —
    # because the suite resets data between tests and workers sharing one would wipe each
    # other's rows mid-run.
    "pytest-xdist>=3.6",
    # `tests/test_ci_shape.py` parses .github/workflows/ci.yml. uvicorn[standard] happens
    # to install pyyaml today, but a test depending on a transitive of a runtime extra is
    # a green suite waiting on someone else's dependency change.
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = ["app"]` already ships the eval fixtures — a force-include of the
# same path added them a SECOND time, hatchling refused the duplicate, and every
# non-editable `pip install .` (the one backend/Dockerfile runs) died generating
# metadata. The guard that the installed wheel ships them is the
# `backend-packaging` job in ci.yml.
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Read by `scripts/scan_ci.py` (`bandit -c pyproject.toml -r .`, GRPH-1110). No rule is skipped
# here: each finding in `app/` is fixed or carries a line-level `# nosec <id>` with its reason.
[tool.bandit]
exclude_dirs = [
    # Test code asserts by design (B101) and builds fixtures with literal secrets and SQL. It
    # never ships: `packages = ["app"]` above is the whole wheel.
    "tests",
    # Append-only migration history. Its B608s interpolate module-level table and column
    # constants into DDL run once by the operator; no request reaches them, and rewriting
    # applied revisions to carry markers is churn on history.
    "alembic/versions",
    # A local virtualenv is third-party code, audited by pip-audit, not ours to lint.
    ".venv",
]
