[project]
name = "graphban-api"
version = "2026.11.73"
description = "Graphban backend — linear tracker + agent memory + MCP tools"
license = "LicenseRef-FSL-1.1-Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "httpx>=0.28",
    "cryptography>=43",
    "redis>=5.2",
    "numpy>=2.0",
    "pywebpush>=2.5.0",
]

[project.scripts]
# Both names run the same CLI through the rename; `agentledger` is kept indefinitely so a
# documented command in an operator's runbook never stops working (AL-262).
graphban = "app.cli:main"
agentledger = "app.cli:main"

[project.optional-dependencies]
# Cloud chat/extraction via Claude. Local (Ollama) and stub need no extra deps.
cloud = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.3",
    # Parallel test execution. Each worker gets its OWN database — see tests/conftest.py —
    # because the suite resets data between tests and workers sharing one would wipe each
    # other's rows mid-run.
    "pytest-xdist>=3.6",
    # `tests/test_ci_shape.py` parses .github/workflows/ci.yml. uvicorn[standard] happens
    # to install pyyaml today, but a test depending on a transitive of a runtime extra is
    # a green suite waiting on someone else's dependency change.
    "pyyaml>=6.0",
    # A hung test used to hold a drain for hours: the only limit was GitHub's 6-hour job
    # default, and cancelling the job reports no test name (GRPH-1928). This names the
    # stuck test and dumps its stack instead. Configured under [tool.pytest.ini_options].
    "pytest-timeout>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `packages = ["app"]` already ships the eval fixtures — a force-include of the
# same path added them a SECOND time, hatchling refused the duplicate, and every
# non-editable `pip install .` (the one backend/Dockerfile runs) died generating
# metadata. The guard that the installed wheel ships them is the
# `backend-packaging` job in ci.yml.
packages = ["app"]
# Refusal coverage is a build artefact (GRPH-1185): `scripts/refusal_ratchet.py publish` writes
# it before the build and .gitignore keeps it out of git — which would also keep it out of this
# wheel, since hatchling honours .gitignore. `artifacts` ships it when present; absent, the
# install reports `published: false`. Guarded by the `backend-packaging` job in ci.yml.
artifacts = ["app/data/refusal_coverage.json", "app/data/gban_skills.json", "app/data/playbooks.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A per-test ceiling, not a suite budget (GRPH-1928). CI run 45505794524 sat in
# `pytest -q -n auto` for over two hours and only a human cancelling the job ended it — and
# a cancelled job names no test, so a drain cannot tell a hang from a slow suite and waits.
# 300s is ~10x the heaviest FILE in tests/shard_weights.json (29.33s of measured setup+call
# covering every test in it), and the longest explicit wait anywhere in the suite is a
# `time.sleep(30)` inside a generated CHILD process, not in a test body — so no legitimate
# test is near the ceiling, and a stuck one is named with its stack five minutes in.
# The method is left at pytest-timeout's default (SIGALRM where the platform has it, a timer
# thread where it does not). Measured against three hangs — `time.sleep`, a wait on a lock
# nobody releases, and ~19s of exponential backtracking inside the `re` C loop — SIGALRM
# ended all three at the limit, serial and under `-n 2`, with `Failed: Timeout (>5.0s) from
# pytest-timeout.` and the nodeid, and the rest of the run continued. Forcing
# `timeout_method = "thread"` is worse here: it ends a timeout with `os._exit(1)`, so under
# `-n auto` the worker dies and takes its remaining tests with it (`worker 'gw0' crashed
# while running …`). A wedge SIGALRM cannot reach at all is what the job-level
# `timeout-minutes` in .github/workflows/ci.yml is for — neither bound alone is the fix.
timeout = 300

# Read by `scripts/scan_ci.py` (`bandit -c pyproject.toml -r .`, GRPH-1110). No rule is skipped
# here: each finding in `app/` is fixed or carries a line-level `# nosec <id>` with its reason.
[tool.bandit]
exclude_dirs = [
    # Test code asserts by design (B101) and builds fixtures with literal secrets and SQL. It
    # never ships: `packages = ["app"]` above is the whole wheel.
    "tests",
    # Append-only migration history. Its B608s interpolate module-level table and column
    # constants into DDL run once by the operator; no request reaches them, and rewriting
    # applied revisions to carry markers is churn on history.
    "alembic/versions",
    # A local virtualenv is third-party code, audited by pip-audit, not ours to lint.
    ".venv",
]
