<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;flex:none;line-height:0;vertical-align:middle;width:{{ px }};height:{{ px }};">
<sc-if value="{{ isE }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24"><path d="M12 2.5 20 6v5.5c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10V6z" fill="currentColor"></path><path d="m8.5 12 2.4 2.4 4.6-4.8" fill="none" stroke="#0a0c0e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if>
<sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="m8.5 12 2.4 2.4 4.6-4.8"></path></svg></sc-if>
<sc-if value="{{ isX }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"></path><path d="M20 4 11 13"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></sc-if>
<sc-if value="{{ isA }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg></sc-if>
<sc-if value="{{ isU }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="3 3"></circle><path d="M7 17 17 7"></path></svg></sc-if>
<sc-if value="{{ isN }}" hint-placeholder-val="{{ false }}"><svg width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M8 12h8"></path></svg></sc-if>
</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:48,&quot;height&quot;:48},&quot;level&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;enforced&quot;,&quot;checked&quot;,&quot;external&quot;,&quot;advisory&quot;,&quot;unmeasured&quot;,&quot;nu&quot;],&quot;default&quot;:&quot;enforced&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const l = this.props.level;
    return { px: (Number(this.props.size) || 12) + "px", isE: l === "enforced", isC: l === "checked", isX: l === "external", isA: l === "advisory", isU: l === "unmeasured", isN: l === "nu" };
  }
}
</script>
</body>
</html>
