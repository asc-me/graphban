[project]
name = "graphban-fleet"
version = "0.16.1"
description = "Fleet supervisor for Graphban — spawns and retires fleet members on the machine the agents actually run on"
# Without this the PyPI project page is blank. The README's links are absolute for the
# same reason: repo-relative paths render on GitHub and 404 on PyPI.
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"

# PRD-22 D-e / G6: install surface is httpx-thin, and that is a REQUIREMENT rather
# than a preference. `graphban-api` pulls fastapi, sqlalchemy, pgvector, psycopg,
# alembic, redis and cryptography; a laptop running four vendor CLIs needs none of
# them. `tests/test_packaging.py` fails if any of those appear here, because the
# only thing keeping a dependency list thin is something that objects when it isn't.
dependencies = [
    "httpx>=0.28",
]

[project.urls]
Homepage = "https://github.com/asc-me/graphban"
Repository = "https://github.com/asc-me/graphban"
Documentation = "https://github.com/asc-me/graphban/blob/main/fleet/README.md"

[project.scripts]
# `graphban` and `agentledger` are both already claimed by backend/pyproject.toml, so a
# distinct entry point is required regardless of where this package lives (PRD-22 D-e).
gbfleet = "gbfleet.cli:main"
# The first-party coding agent (PRD-24 D8). A separate entry point rather than a
# `gbfleet` subcommand because the supervisor RESOLVES it like any other vendor binary:
# `adapters/gbagent.py` looks it up on PATH and checks its version before spawning.
gbagent = "gbagent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gbfleet", "src/gbagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_memory: read the host's actual free memory instead of the pinned test value",
]

# Read by `scripts/scan_ci.py` (`bandit -c pyproject.toml -r .`, GRPH-1110). Any other finding
# is fixed or carries a line-level `# nosec <id>` with its reason.
[tool.bandit]
exclude_dirs = [
    # Test code asserts by design (B101) and fakes credentials. It is not in the wheel.
    "tests",
    # A local virtualenv is third-party code, audited by pip-audit, not ours to lint.
    ".venv",
]
skips = [
    # B404 (import subprocess): this is a developer CLI whose job is driving git, gh and the
    # user's own tools. Importing subprocess is the feature, not a smell.
    "B404",
    # B603 (subprocess without shell=True): fires on EVERY argv-list call, which is the safe
    # form. B602 (shell=True) stays on, and that is the injection check that matters.
    "B603",
    # B607 (partial executable path): `git`/`gh` are resolved from the user's own PATH on
    # their own machine on purpose; hardcoding /usr/bin/git breaks every Homebrew install.
    "B607",
]
