[suite]
id = "gbfleet-template"
version = "1.0.1"

[[task]]
id = "build-slugify"
kind = "build"
base_sha = "root"
reference = "m1-ref"
size_band = "S"
capabilities = ["A1", "A3", "A5", "C2", "C1", "E1", "E2", "H5"]
touchpoints = ["pkg/m1.py", "tests/test_m1.py"]
[task.brief]
title = "Implement slugify(text)"
description = "pkg/m1.py holds a stub that raises NotImplementedError. Implement `slugify(text)`: Lowercase `text`, turning each run of non-alphanumerics into one '-'. Add your own test in tests/test_m1.py."
acceptance = ["slugify(text) behaves as described", "tests/test_m1.py exists and fails if the change to pkg/m1.py is reverted"]
[task.check]
command = "python3 -m unittest"
tests = ["tests/test_m1.py"]

