[[task]]
id = "review-take_last-defect"
kind = "review"
base_sha = "root"
ref = "r1-defect"
expect = "bounce"
size_band = "S"
capabilities = ["F1"]
touchpoints = ["pkg/r1.py"]
[task.brief]
title = "Review the change to take_last"
description = "Review the commit that edits pkg/r1.py. Sign off if it is correct, bounce with a reason if it breaks behaviour."
acceptance = ["the verdict matches the code"]
[task.check]
command = "python3 -m unittest"
tests = ["tests/test_r1.py"]

