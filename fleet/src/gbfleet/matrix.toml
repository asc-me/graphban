# The preference matrix (PRD-37 D2): what runs which kind of work, and what proved it.
#
# FACTS ONLY. Taste lives in a user's profile (server-side, PRD-37 D3) and constraints in a
# project's policy (D4); this file states which harness × model pairs are verified, for what,
# with the item that proved it. A row moves to `verified` or `failed` by a commit naming the
# item — never by a job. TOML because gbfleet is httpx-thin by requirement (PRD-22 D-e) and
# `tomllib` is in the standard library; PRD-37 wrote "yaml" before that constraint was checked.
#
# status: verified | unverified | failed | unregistered (the harness has no adapter in ADAPTERS,
#         which is a fact worth a row rather than a silence — codex today, qwen-code until its
#         adapter lands).
# evidence: newest LAST. `status` is read against the newest entry; history stays here.
#           An entry may name `capability` (PRD-41 D10); the newest entry naming a capability
#           is that capability's status, else the row's status.
# price_per_mtoken_in / price_per_mtoken_out: optional (D19). Currency appears in the
#           explanation only where a row carries them.
# order: preference within a tier when scores tie (after verified-over-unverified and the
#        user's own defaults order — PRD-37 D6).
# cost_class: local | cheap | frontier  →  cost axis 1.0 | 0.6 | 0.2.

